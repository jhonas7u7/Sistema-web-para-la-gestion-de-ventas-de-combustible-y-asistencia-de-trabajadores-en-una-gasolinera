<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="list-toolbar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" placeholder="Buscar por nombre o documento..." data-table-search>
        </div>
        <div class="toolbar-actions">
          <a th:href="@{/clientes/nuevo}" class="btn btn-brand btn-sm"><i class="bi bi-plus-lg me-1"></i>Nuevo cliente</a>
        </div>
      </div>

      <div class="panel">
        <div class="table-responsive">
          <table class="table table-modern align-middle">
            <thead>
              <tr><th>ID</th><th>Nombre / Razón social</th><th>Documento</th><th>Teléfono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody>
              <tr th:each="c : ${clientes}">
                <td th:text="${'CL-' + c.id}">CL-1</td>
                <td th:text="${c.nombre}">Nombre</td>
                <td th:text="${c.documento}">Documento</td>
                <td th:text="${c.telefono}">Teléfono</td>
                <td th:text="${c.correo}">Correo</td>
                <td><span class="badge" th:classappend="${c.estado == 'Activo'} ? 'badge-success' : 'badge-secondary'" th:text="${c.estado}">Estado</span></td>
                <td>
                  <div class="table-actions">
                    <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn-action" title="Editar"><i class="bi bi-pencil"></i></a>
                    <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="btn-action btn-action-danger" title="Eliminar"
                       onclick="return confirm('¿Eliminar este cliente?');"><i class="bi bi-trash"></i></a>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="7" class="text-center text-muted py-4">No hay clientes registrados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
