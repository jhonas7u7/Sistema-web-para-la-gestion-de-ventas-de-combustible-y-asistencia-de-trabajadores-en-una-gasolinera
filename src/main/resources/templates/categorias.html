<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de categorías · OctanoGT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/general :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="main-column">

  <div th:replace="~{fragments/general :: topbar}"></div>
  <main class="main-content">

    <div class="list-toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" class="form-control" placeholder="Buscar categoría..." data-table-search>
      </div>
      <div class="toolbar-actions">
        <select class="form-select form-select-sm toolbar-filter">
          <option>Todos los estados</option>
          <option>Activo</option>
          <option>Inactivo</option>
        </select>
        <button class="btn btn-brand btn-sm" data-bs-toggle="modal" data-bs-target="#modalCategoria"><i class="bi bi-plus-lg me-1"></i>Nueva categoría</button>
      </div>
    </div>
    <div class="panel">
      <div class="table-responsive">
        <table class="table table-modern align-middle">
          <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody><tr><td>C-01</td><td>Combustibles</td><td>Gasoholes, diésel y GLP</td><td><span class="badge badge-success">Activo</span></td><td><div class="table-actions"><button class="btn-action" title="Editar"><i class="bi bi-pencil"></i></button><button class="btn-action btn-action-danger" title="Eliminar"><i class="bi bi-trash"></i></button></div></td></tr>
<tr><td>C-02</td><td>Lubricantes</td><td>Aceites y aditivos para motor</td><td><span class="badge badge-success">Activo</span></td><td><div class="table-actions"><button class="btn-action" title="Editar"><i class="bi bi-pencil"></i></button><button class="btn-action btn-action-danger" title="Eliminar"><i class="bi bi-trash"></i></button></div></td></tr>
<tr><td>C-03</td><td>Accesorios</td><td>Artículos y repuestos menores</td><td><span class="badge badge-success">Activo</span></td><td><div class="table-actions"><button class="btn-action" title="Editar"><i class="bi bi-pencil"></i></button><button class="btn-action btn-action-danger" title="Eliminar"><i class="bi bi-trash"></i></button></div></td></tr>
<tr><td>C-04</td><td>Servicios</td><td>Servicios adicionales de la estación</td><td><span class="badge badge-secondary">Inactivo</span></td><td><div class="table-actions"><button class="btn-action" title="Editar"><i class="bi bi-pencil"></i></button><button class="btn-action btn-action-danger" title="Eliminar"><i class="bi bi-trash"></i></button></div></td></tr>
</tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title"><i class="bi bi-tag me-2"></i>Nueva categoría</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <form class="row g-3">
              <div class="col-12"><label class="form-label">Nombre</label><input type="text" class="form-control" placeholder="Ej. Combustibles"></div>
              <div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" rows="3" placeholder="Breve descripción de la categoría"></textarea></div>
              <div class="col-12"><label class="form-label">Estado</label><select class="form-select"><option>Activo</option><option>Inactivo</option></select></div>
            </form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-brand" data-bs-dismiss="modal">Guardar categoría</button>
          </div>
        </div>
      </div>
    </div>

  </main>
  <div th:replace="~{fragments/general :: footer}"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
