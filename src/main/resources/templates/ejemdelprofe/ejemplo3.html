<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo 3 - IF + FOR</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; width: 60%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #2196F3; color: white; }
        .aprobado { background-color: #d4edda; color: #155724; }
        .reprobado { background-color: #f8d7da; color: #721c24; }
        .excelente { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
<h1>Ejemplo 3: Combinando IF + FOR</h1>

<h3>Lista de estudiantes con calificaciones:</h3>
<table>
    <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Nota</th>
        <th>Estado</th>
    </tr>
    <!-- Bucle for each combinado con if -->
    <tr th:each="estudiante, iterStat : ${estudiantes}"
        th:class="${estudiante.nota >= 7 ? 'aprobado' : (estudiante.nota >= 9 ? 'excelente' : 'reprobado')}">
        <td th:text="${iterStat.count}">1</td>
        <td th:text="${estudiante.nombre}">Nombre</td>
        <td th:text="${estudiante.nota}">0</td>
        <td>
            <!-- IF dentro del bucle -->
            <span th:if="${estudiante.nota >= 7}">✅ Aprobado</span>
            <span th:if="${estudiante.nota < 7}">❌ Reprobado</span>

            <!-- IF adicional para excelencia -->
            <span th:if="${estudiante.nota >= 9}">🏆 ¡Excelente!</span>
        </td>
    </tr>
</table>


<br>
<a href="/ejemplo1">← Volver al inicio</a>
</body>
</html>
