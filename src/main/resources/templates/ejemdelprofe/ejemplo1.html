<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo 1 - Condicional IF</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .mayor { color: green; font-weight: bold; }
        .menor { color: red; font-weight: bold; }
    </style>
</head>
<body>
<h1>Ejemplo 1: Uso de IF en Thymeleaf</h1>

<!-- Mostrar edad -->
<p>Edad: <span th:text="${edad}">0</span> años</p>

<!-- Condicional IF -->
<div th:if="${edad >= 18}">
    <p class="mayor">✅ Eres mayor de edad - Puedes votar</p>
</div>

<div th:if="${edad < 18}">
    <p class="menor">❌ Eres menor de edad - No puedes votar</p>
</div>

<!-- Usando th:unless (lo contrario de if) -->
<div th:unless="${edad >= 60}">
    <p>📝 Aún no eres adulto mayor</p>
</div>

<br>
<a href="/ejemplo2">Siguiente ejemplo (For) →</a>
</body>
</html>
