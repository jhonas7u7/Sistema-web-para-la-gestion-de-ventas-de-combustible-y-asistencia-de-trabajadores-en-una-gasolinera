<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Personas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .formulario {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 80px;
        }
        input {
            padding: 5px;
            width: 200px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<h1>Registro de Personas</h1>

<div class="formulario">
    <form action="#" th:action="@{/guardar}" th:object="${persona}" method="post">
        <div class="campo">
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" required/>
        </div>

        <div class="campo">
            <label>Email:</label>
            <input type="email" th:field="*{email}" required/>
        </div>

        <div class="campo">
            <label>Edad:</label>
            <input type="number" th:field="*{edad}" required/>
        </div>

        <button type="submit">Guardar Persona</button>
    </form>
</div>
</body>
</html>
