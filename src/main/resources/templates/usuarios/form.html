<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div class="panel form-panel">
        <div class="panel-head">
          <h3 th:text="(${usuario.id} == null) ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h3>
        </div>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="row g-3">
          <input type="hidden" th:field="*{id}">

          <div class="col-md-6">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" th:field="*{nombreCompleto}" placeholder="Ej. Ana Torres" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" th:field="*{usuario}" placeholder="Ej. atorres" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" th:field="*{correo}" placeholder="correo@octanogt.com" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Rol</label>
            <select class="form-select" th:field="*{rol}">
              <option value="Administrador">Administrador</option>
              <option value="Encargado de ventas">Encargado de ventas</option>
              <option value="Trabajador">Trabajador</option>
              <option value="Encargado de inventario">Encargado de inventario</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>

          <div class="col-12 form-actions">
            <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i>Guardar usuario</button>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
