<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo 2 - Bucle FOR</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>Ejemplo 2: Uso de FOR (each) en Thymeleaf</h1>

<h3>Lista de productos:</h3>
<table>
    <tr>
        <th>#</th>
        <th>Producto</th>
    </tr>
    <!-- Bucle for each -->
    <tr th:each="producto, iterStat : ${productos}">
        <td th:text="${iterStat.count}">1</td>
        <td th:text="${producto}">Producto</td>
    </tr>
</table>

<p>Total de productos: <span th:text="${productos.size()}">0</span></p>

<br>

</body>
</html>
