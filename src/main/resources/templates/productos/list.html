<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="list-toolbar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" placeholder="Buscar producto o combustible..." data-table-search>
        </div>
        <div class="toolbar-actions">
          <a th:href="@{/productos/nuevo}" class="btn btn-brand btn-sm"><i class="bi bi-plus-lg me-1"></i>Nuevo producto</a>
        </div>
      </div>

      <div class="panel">
        <div class="table-responsive">
          <table class="table table-modern align-middle">
            <thead>
              <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody>
              <tr th:each="p : ${productos}">
                <td th:text="${p.codigo}">P-001</td>
                <td th:text="${p.nombre}">Nombre</td>
                <td th:text="${p.categoria}">Categoría</td>
                <td th:text="${'S/ ' + #numbers.formatDecimal(p.precio, 1, 2)}">S/ 0.00</td>
                <td th:text="${#numbers.formatDecimal(p.stock, 1, 2) + ' ' + p.unidadMedida}">0</td>
                <td><span class="badge" th:classappend="${p.estado == 'Activo'} ? 'badge-success' : 'badge-secondary'" th:text="${p.estado}">Estado</span></td>
                <td>
                  <div class="table-actions">
                    <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn-action" title="Editar"><i class="bi bi-pencil"></i></a>
                    <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" class="btn-action btn-action-danger" title="Eliminar"
                       onclick="return confirm('¿Eliminar este producto?');"><i class="bi bi-trash"></i></a>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="7" class="text-center text-muted py-4">No hay productos registrados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
