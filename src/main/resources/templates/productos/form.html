<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div class="panel form-panel">
        <div class="panel-head">
          <h3 th:text="(${producto.id} == null) ? 'Nuevo producto' : 'Editar producto'">Producto</h3>
        </div>

        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="row g-3">
          <input type="hidden" th:field="*{id}">

          <div class="col-md-6">
            <label class="form-label">Código</label>
            <input type="text" class="form-control" th:field="*{codigo}" placeholder="Ej. P-008" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Gasohol 84" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{categoria}">
              <option th:each="c : ${categorias}" th:value="${c.nombre}" th:text="${c.nombre}">Categoría</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Unidad de medida</label>
            <select class="form-select" th:field="*{unidadMedida}">
              <option value="gal">Galones (gal)</option>
              <option value="unid.">Unidades (unid.)</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Precio (S/)</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" placeholder="0.00" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock actual</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{stock}" placeholder="0">
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock mínimo</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{stockMinimo}" placeholder="0">
          </div>
          <div class="col-md-6">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>

          <div class="col-12 form-actions">
            <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i>Guardar producto</button>
            <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
