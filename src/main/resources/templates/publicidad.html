<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicidad · OctanoGT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/general :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="main-column">

  <div th:replace="~{fragments/general :: topbar}"></div>
  <main class="main-content">
    <div class="row g-3">
      <div class="col-md-4">
        <div class="promo-card">
          <i class="bi bi-fuel-pump"></i>
          <h4>Combustibles de calidad</h4>
          <p>Gasohol 90, 95, 97, Diésel B5 y GLP con control de calidad constante.</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="promo-card">
          <i class="bi bi-shield-check"></i>
          <h4>Seguridad garantizada</h4>
          <p>Personal capacitado en protocolos de seguridad y manejo de hidrocarburos.</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="promo-card">
          <i class="bi bi-cup-straw"></i>
          <h4>Tienda de conveniencia</h4>
          <p>Snacks, bebidas y lubricantes disponibles durante todo el horario de atención.</p>
        </div>
      </div>
    </div>

  </main>
  <div th:replace="~{fragments/general :: footer}"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
