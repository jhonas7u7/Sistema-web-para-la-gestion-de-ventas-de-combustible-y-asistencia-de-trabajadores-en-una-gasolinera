<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="list-toolbar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" placeholder="Buscar categoría..." data-table-search>
        </div>
        <div class="toolbar-actions">
          <a th:href="@{/categorias/nuevo}" class="btn btn-brand btn-sm"><i class="bi bi-plus-lg me-1"></i>Nueva categoría</a>
        </div>
      </div>

      <div class="panel">
        <div class="table-responsive">
          <table class="table table-modern align-middle">
            <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
              <tr th:each="c : ${categorias}">
                <td th:text="${'C-' + c.id}">C-1</td>
                <td th:text="${c.nombre}">Nombre</td>
                <td th:text="${c.descripcion}">Descripción</td>
                <td><span class="badge" th:classappend="${c.estado == 'Activo'} ? 'badge-success' : 'badge-secondary'" th:text="${c.estado}">Estado</span></td>
                <td>
                  <div class="table-actions">
                    <a th:href="@{/categorias/editar/{id}(id=${c.id})}" class="btn-action" title="Editar"><i class="bi bi-pencil"></i></a>
                    <a th:if="${c.estado == 'Activo'}" th:href="@{/categorias/desactivar/{id}(id=${c.id})}" class="btn-action btn-action-danger" title="Desactivar"
                       onclick="return confirm('¿Desactivar esta categoría? No se elimina, solo deja de estar disponible.');"><i class="bi bi-slash-circle"></i></a>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="5" class="text-center text-muted py-4">No hay categorías registradas.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
