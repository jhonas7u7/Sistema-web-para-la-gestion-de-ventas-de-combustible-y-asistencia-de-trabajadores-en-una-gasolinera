# Configuracion del Sistema Web para la Gestion de Ventas de Combustible
# y Asistencia de Trabajadores de una Gasolinera - Avance 2

spring.application.name=gasolinera

server.port=8080

# Desactiva la cache de plantillas Thymeleaf para ver los cambios sin reiniciar
spring.thymeleaf.cache=false

# Formato esperado para campos de tipo fecha en los formularios (dd/MM/yyyy)
spring.mvc.format.date=dd/MM/yyyy

# Este proyecto NO usa base de datos en este avance (datos en memoria)
