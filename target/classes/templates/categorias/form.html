<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div class="panel form-panel">
        <div class="panel-head">
          <h3 th:text="(${categoria.id} == null) ? 'Nueva categoría' : 'Editar categoría'">Categoría</h3>
        </div>

        <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" class="row g-3">
          <input type="hidden" th:field="*{id}">

          <div class="col-12">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Combustibles" required>
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" rows="3" th:field="*{descripcion}" placeholder="Breve descripción de la categoría"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>

          <div class="col-12 form-actions">
            <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i>Guardar categoría</button>
            <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
