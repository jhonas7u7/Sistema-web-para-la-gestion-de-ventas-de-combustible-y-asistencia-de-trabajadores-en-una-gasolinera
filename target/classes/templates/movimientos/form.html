<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div class="panel form-panel">
        <div class="panel-head"><h3>Nuevo movimiento de inventario</h3></div>

        <form th:action="@{/movimientos/guardar}" method="post" class="row g-3">

          <div class="col-12">
            <label class="form-label">Producto o combustible</label>
            <select class="form-select" name="productoId" required>
              <option th:each="p : ${productos}" th:value="${p.id}"
                      th:text="${p.nombre + ' — ' + #numbers.formatDecimal(p.stock, 1, 2) + ' ' + p.unidadMedida + ' disponibles'}">Producto</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Tipo de movimiento</label>
            <select class="form-select" name="tipo" required>
              <option value="Entrada">Entrada</option>
              <option value="Salida">Salida</option>
              <option value="Ajuste">Ajuste</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Cantidad</label>
            <input type="number" step="0.01" class="form-control" name="cantidad" placeholder="0" required>
            <div class="form-text">Para un ajuste negativo, ingresa el valor con signo menos (Ej. -2).</div>
          </div>

          <div class="col-12">
            <label class="form-label">Responsable</label>
            <input type="text" class="form-control" name="responsable" placeholder="Nombre del responsable" value="Jorge Salas Medina" required>
          </div>
          <div class="col-12">
            <label class="form-label">Observación</label>
            <textarea class="form-control" rows="2" name="observacion" placeholder="Motivo del movimiento"></textarea>
          </div>

          <div class="col-12 form-actions">
            <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i>Guardar movimiento</button>
            <a th:href="@{/movimientos}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
