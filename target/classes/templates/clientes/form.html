<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div class="panel form-panel">
        <div class="panel-head">
          <h3 th:text="(${cliente.id} == null) ? 'Nuevo cliente' : 'Editar cliente'">Cliente</h3>
        </div>

        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="row g-3">
          <input type="hidden" th:field="*{id}">

          <div class="col-12">
            <label class="form-label">Nombre o razón social</label>
            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre completo o empresa" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Documento (DNI/RUC)</label>
            <input type="text" class="form-control" th:field="*{documento}" placeholder="Número de documento">
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" th:field="*{telefono}" placeholder="987 654 321">
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" th:field="*{correo}" placeholder="correo@ejemplo.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>

          <div class="col-12 form-actions">
            <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i>Guardar cliente</button>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
