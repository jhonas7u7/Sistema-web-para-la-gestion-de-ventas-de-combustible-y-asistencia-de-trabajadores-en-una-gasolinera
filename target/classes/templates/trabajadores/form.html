<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div class="panel form-panel">
        <div class="panel-head">
          <h3 th:text="(${trabajador.id} == null) ? 'Nuevo trabajador' : 'Editar trabajador'">Trabajador</h3>
        </div>

        <form th:action="@{/trabajadores/guardar}" th:object="${trabajador}" method="post" class="row g-3">
          <input type="hidden" th:field="*{id}">

          <div class="col-md-6">
            <label class="form-label">Código</label>
            <input type="text" class="form-control" th:field="*{codigo}" placeholder="Ej. T-006" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" th:field="*{nombreCompleto}" placeholder="Nombres y apellidos" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Cargo</label>
            <select class="form-select" th:field="*{cargo}">
              <option value="Despachador">Despachador</option>
              <option value="Cajero">Cajero</option>
              <option value="Encargado de inventario">Encargado de inventario</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" th:field="*{telefono}" placeholder="987 654 321">
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha de ingreso</label>
            <input type="date" class="form-control" th:field="*{fechaIngreso}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>

          <div class="col-12 form-actions">
            <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i>Guardar trabajador</button>
            <a th:href="@{/trabajadores}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
