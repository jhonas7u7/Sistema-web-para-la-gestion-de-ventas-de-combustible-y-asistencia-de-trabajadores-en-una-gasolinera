<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar(active=${activePage})}"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-column">
    <header th:replace="~{fragments/layout :: topbar(title=${pageTitle}, crumbs=${crumbs})}"></header>
    <main class="main-content">

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><div class="kpi-card kpi-teal small-kpi"><i class="bi bi-person-check"></i><div><span class="kpi-value" th:text="${enTurno}">0</span><span class="kpi-label">En turno</span></div></div></div>
        <div class="col-6 col-md-3"><div class="kpi-card kpi-blue small-kpi"><i class="bi bi-check2-circle"></i><div><span class="kpi-value" th:text="${presentes}">0</span><span class="kpi-label">Presentes</span></div></div></div>
        <div class="col-6 col-md-3"><div class="kpi-card kpi-amber small-kpi"><i class="bi bi-clock-history"></i><div><span class="kpi-value" th:text="${tardanzas}">0</span><span class="kpi-label">Tardanzas</span></div></div></div>
        <div class="col-6 col-md-3"><div class="kpi-card kpi-red small-kpi"><i class="bi bi-x-circle"></i><div><span class="kpi-value" th:text="${ausentes}">0</span><span class="kpi-label">Ausentes</span></div></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="panel">
            <div class="panel-head"><h3>Registrar entrada</h3></div>
            <form th:action="@{/asistencia/entrada}" method="post" class="row g-3">
              <div class="col-12">
                <label class="form-label">Trabajador</label>
                <select class="form-select" name="trabajadorId" required>
                  <option th:each="t : ${trabajadores}" th:value="${t.id}" th:text="${t.nombreCompleto}">Trabajador</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Hora (opcional, por defecto la hora actual)</label>
                <input type="time" class="form-control" name="hora">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-brand w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Registrar entrada</button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="panel">
            <div class="panel-head"><h3>Registro del día</h3></div>
            <div class="table-responsive">
              <table class="table table-modern align-middle">
                <thead><tr><th>Trabajador</th><th>Fecha</th><th>Hora de entrada</th><th>Hora de salida</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                  <tr th:each="a : ${registros}">
                    <td th:text="${a.trabajadorNombre}">Trabajador</td>
                    <td th:text="${#temporals.format(a.fecha, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td th:text="${a.horaEntrada != null ? #temporals.format(a.horaEntrada, 'HH:mm') : '—'}">—</td>
                    <td th:text="${a.horaSalida != null ? #temporals.format(a.horaSalida, 'HH:mm') : '—'}">—</td>
                    <td>
                      <span class="badge"
                            th:classappend="${a.estado == 'Presente'} ? 'badge-success' : (${a.estado == 'En turno'} ? 'badge-info' : (${a.estado == 'Tardanza'} ? 'badge-warning' : 'badge-danger'))"
                            th:text="${a.estado}">Estado</span>
                    </td>
                    <td>
                      <a th:if="${a.horaEntrada != null and a.horaSalida == null}" th:href="@{/asistencia/salida/{id}(id=${a.id})}" class="btn btn-outline-brand btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Registrar salida
                      </a>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(registros)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay registros de asistencia todavía.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
